<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EuroTrip Weather</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#0d1117">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background-color: #0d1117; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    .card-gradient {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto pb-16 relative min-h-screen">

  <!-- Toast Notification -->
  <div id="toast-notif" class="fixed top-5 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50 border border-emerald-400/30 w-max max-w-[90%]">
    <span id="toast-icon">✅</span>
    <span id="toast-msg">Data cuaca berhasil di-sync!</span>
  </div>

  <!-- Header -->
  <div class="text-center mb-6 pt-2">
    <div class="inline-block bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] font-bold px-3 py-1 rounded-full mb-2 tracking-wide">
      ❄️ WINTER TRIP • FEB 2027
    </div>
    <h1 class="text-2xl font-extrabold text-white tracking-tight">EuroTrip Weather</h1>
    <p class="text-xs text-gray-400 mt-1">Milan • Prague • Vienna • Budapest</p>
  </div>

  <!-- Weather Cards Container -->
  <div id="weather-container" class="space-y-4"></div>

  <!-- Sync Section -->
  <div class="mt-6 bg-gray-900/90 p-4 rounded-2xl border border-gray-800 shadow-xl">
    <button id="sync-btn" onclick="syncWeatherData()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] py-3.5 rounded-xl text-sm font-bold transition-all duration-200 text-white flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
      <span id="sync-icon">🔄</span>
      <span id="sync-text">Sync Live & Climatology Data</span>
    </button>
    <div id="sync-status" class="text-[11px] text-gray-400 text-center mt-2.5">
      Baseline: Rata-rata Historis Februari (Open-Meteo API Ready)
    </div>
  </div>

  <script>
    // Register minimal Service Worker inline agar Chrome selalu mengizinkan Install App (PWA)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('fetch', (e) => {});
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    let itinerary = [
      {
        id: 'milan-1',
        city: 'Milan',
        country: 'Italia',
        flag: '🇮🇹',
        dates: '7 – 11 Feb 2027',
        startDate: '2027-02-07',
        endDate: '2027-02-11',
        lat: 45.4642,
        lon: 9.1900,
        dayTemp: 8,
        nightTemp: 1,
        sunset: '17:42',
        condition: 'Cerah Berawan & Dingin',
        icon: '⛅',
        precipProb: '20%',
        source: 'Historis Feb'
      },
      {
        id: 'prague',
        city: 'Prague',
        country: 'Ceko',
        flag: '🇨🇿',
        dates: '11 – 14 Feb 2027',
        startDate: '2027-02-11',
        endDate: '2027-02-14',
        lat: 50.0755,
        lon: 14.4378,
        dayTemp: 3,
        nightTemp: -3,
        sunset: '17:16',
        condition: 'Berawan / Potensi Salju Ringan',
        icon: '🌨️',
        precipProb: '35%',
        source: 'Historis Feb'
      },
      {
        id: 'vienna',
        city: 'Vienna',
        country: 'Austria',
        flag: '🇦🇹',
        dates: '14 – 17 Feb 2027',
        startDate: '2027-02-14',
        endDate: '2027-02-17',
        lat: 48.2082,
        lon: 16.3738,
        dayTemp: 5,
        nightTemp: -1,
        sunset: '17:19',
        condition: 'Berawan & Berangin',
        icon: '☁️',
        precipProb: '25%',
        source: 'Historis Feb'
      },
      {
        id: 'budapest',
        city: 'Budapest',
        country: 'Hungaria',
        flag: '🇭🇺',
        dates: '17 – 20 Feb 2027',
        startDate: '2027-02-17',
        endDate: '2027-02-20',
        lat: 47.4979,
        lon: 19.0402,
        dayTemp: 6,
        nightTemp: -1,
        sunset: '17:13',
        condition: 'Cerah Berawan',
        icon: '🌤️',
        precipProb: '20%',
        source: 'Historis Feb'
      },
      {
        id: 'milan-2',
        city: 'Milan',
        country: 'Italia',
        flag: '🇮🇹',
        dates: '20 – 21 Feb 2027',
        startDate: '2027-02-20',
        endDate: '2027-02-21',
        lat: 45.4642,
        lon: 9.1900,
        dayTemp: 10,
        nightTemp: 2,
        sunset: '17:58',
        condition: 'Cerah Sejuk',
        icon: '☀️',
        precipProb: '15%',
        source: 'Historis Feb'
      }
    ];

    function renderCards() {
      const container = document.getElementById('weather-container');
      container.innerHTML = '';

      itinerary.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-gradient p-4 rounded-2xl border border-gray-800 shadow-lg transition-all duration-300';
        
        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-lg">${item.flag}</span>
                <h2 class="text-lg font-bold text-white">${item.city}</h2>
                <span class="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md border border-gray-700">Stop #${index + 1}</span>
              </div>
              <div class="text-xs text-blue-400 font-semibold mt-0.5">📅 ${item.dates}</div>
            </div>
            <div class="text-right">
              <div class="text-3xl leading-none">${item.icon}</div>
              <div class="text-[10px] text-gray-400 mt-1">${item.condition}</div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-gray-800/80 text-center">
            <div class="bg-black/40 p-2 rounded-xl border border-gray-800/60">
              <div class="text-[10px] text-gray-400 flex items-center justify-center gap-1">
                <span>☀️</span> Siang
              </div>
              <div class="text-base font-extrabold text-amber-400 mt-0.5">${item.dayTemp}°C</div>
            </div>

            <div class="bg-black/40 p-2 rounded-xl border border-gray-800/60">
              <div class="text-[10px] text-gray-400 flex items-center justify-center gap-1">
                <span>🌙</span> Malam
              </div>
              <div class="text-base font-extrabold text-sky-400 mt-0.5">${item.nightTemp}°C</div>
            </div>

            <div class="bg-black/40 p-2 rounded-xl border border-gray-800/60">
              <div class="text-[10px] text-gray-400 flex items-center justify-center gap-1">
                <span>🌇</span> Sunset
              </div>
              <div class="text-base font-extrabold text-orange-400 mt-0.5">${item.sunset}</div>
            </div>
          </div>

          <div class="flex justify-between items-center mt-2.5 text-[10px] text-gray-500 px-1">
            <span>💧 Peluang Hujan/Salju: <strong class="text-gray-300">${item.precipProb}</strong></span>
            <span>Sumber: <strong class="text-gray-400">${item.source}</strong></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('toast-notif');
      const toastIcon = document.getElementById('toast-icon');
      const toastMsg = document.getElementById('toast-msg');

      toastIcon.innerText = isSuccess ? '✅' : 'ℹ️';
      toastMsg.innerText = msg;
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 ${isSuccess ? 'bg-emerald-600 border-emerald-400/30' : 'bg-blue-600 border-blue-400/30'} text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-100 flex items-center gap-2 z-50 border w-max max-w-[90%]`;

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    async function syncWeatherData() {
      const btn = document.getElementById('sync-btn');
      const icon = document.getElementById('sync-icon');
      const text = document.getElementById('sync-text');
      const statusText = document.getElementById('sync-status');

      btn.disabled = true;
      btn.className = "w-full bg-gray-700 cursor-wait py-3.5 rounded-xl text-sm font-bold text-gray-400 flex items-center justify-center gap-2 transition-all duration-200";
      icon.className = "animate-spin";
      text.innerText = "Fetching Open-Meteo API...";

      const today = new Date();
      const targetStart = new Date('2027-02-07');
      const diffDays = Math.ceil((targetStart - today) / (1000 * 60 * 60 * 24));

      try {
        for (let i = 0; i < itinerary.length; i++) {
          const item = itinerary[i];
          
          if (diffDays <= 14 && diffDays >= -5) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunset,precipitation_probability_max&timezone=auto&start_date=${item.startDate}&end_date=${item.endDate}`;
            const res = await fetch(url);
            const data = await res.json();

            if (data && data.daily) {
              const avgMax = data.daily.temperature_2m_max.reduce((a, b) => a + b, 0) / data.daily.temperature_2m_max.length;
              const avgMin = data.daily.temperature_2m_min.reduce((a, b) => a + b, 0) / data.daily.temperature_2m_min.length;
              const sunsetRaw = data.daily.sunset[0];
              const sunsetTime = sunsetRaw ? sunsetRaw.split('T')[1] : item.sunset;
              const precip = data.daily.precipitation_probability_max ? Math.max(...data.daily.precipitation_probability_max) + '%' : item.precipProb;

              item.dayTemp = Math.round(avgMax);
              item.nightTemp = Math.round(avgMin);
              item.sunset = sunsetTime;
              item.precipProb = precip;
              item.source = 'Live Forecast';
            }
          } else {
            const pastStart = item.startDate.replace('2027', '2026');
            const pastEnd = item.endDate.replace('2027', '2026');
            const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${item.lat}&longitude=${item.lon}&start_date=${pastStart}&end_date=${pastEnd}&daily=temperature_2m_max,temperature_2m_min,sunset&timezone=auto`;
            
            const res = await fetch(url);
            const data = await res.json();

            if (data && data.daily && data.daily.temperature_2m_max) {
              const avgMax = data.daily.temperature_2m_max.reduce((a, b) => a + b, 0) / data.daily.temperature_2m_max.length;
              const avgMin = data.daily.temperature_2m_min.reduce((a, b) => a + b, 0) / data.daily.temperature_2m_min.length;
              const sunsetRaw = data.daily.sunset[0];
              const sunsetTime = sunsetRaw ? sunsetRaw.split('T')[1] : item.sunset;

              item.dayTemp = Math.round(avgMax);
              item.nightTemp = Math.round(avgMin);
              item.sunset = sunsetTime;
              item.source = 'Open-Meteo Archive';
            }
          }
        }

        renderCards();
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        if (diffDays <= 14) {
          statusText.innerText = `Terakhir sync Live Forecast: Hari ini, ${timeStr} WIB`;
          showToast('Live Forecast Feb 2027 berhasil diperbarui!', true);
        } else {
          statusText.innerText = `Synced (Open-Meteo Archive): ${timeStr} WIB • Live forecast aktif H-14`;
          showToast('Data cuaca historis & sunset berhasil di-sync!', true);
        }

      } catch (err) {
        console.error(err);
        showToast('Gagal terhubung ke server cuaca, memakai data offline.', false);
      } finally {
        btn.disabled = false;
        btn.className = "w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] py-3.5 rounded-xl text-sm font-bold transition-all duration-200 text-white flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20";
        icon.className = "";
        text.innerText = "Sync Live & Climatology Data";
      }
    }

    renderCards();
  </script>
</body>
</html>
